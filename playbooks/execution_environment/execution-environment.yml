---
version: 3
images:
  base_image:
    name: registry.access.redhat.com/ubi9/ubi-minimal:latest

options:
  package_manager_path: /usr/bin/microdnf

dependencies:
  ansible_core:
    package_pip: ansible-core>=2.15.0
  ansible_runner:
    package_pip: ansible-runner>=2.3.0
  python: requirements.txt
  galaxy: requirements.yml

additional_build_steps:
  prepend_base:
    - RUN microdnf install -y python3 python3-pip tar gzip openssl && microdnf clean all
  append_final:
    - RUN curl -sS https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz | tar -xz -C /usr/local/bin oc
    - RUN curl -sS https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash

...