namespace: demo
requester: ""
kfpHost: ""
clusterDomain: ""
deployNotebooks: false

augurRepoUrl: ""
augurRepoBranch: main
augurRepoUsername: ""
augurRepoToken: ""

minio:
  rootUser: ""
  rootPassword: ""
  bucket: demo
  region: us-east-1
  image: "docker.io/pgsty/silo:latest"
  mcImage: "docker.io/pgsty/mc:latest"

dataGeneration:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - Data Generation"
    tag: latest
    digestRef: ""
  notebook:
    name: data-generation

graphrag:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - GraphRAG Indexing"
    tag: latest
    digestRef: ""
  notebook:
    name: graphrag-indexing

analysis:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - Analysis"
    tag: latest
  notebook:
    name: graphrag-analysis

pipelineTools:
  image:
    registry: ""
    name: pipeline-tools
    tag: latest

tls:
  enableVerification: false

adhocQuery:
  run: false
  graphragDir: "graph_rag_app/source"
  useGlobal: "1"
  retryCount: "3"
  jobId: ""
  gitRepo: ""
  gitBranch: "main"

runPipelines:
  run: false
  args: "--single"
  targetPath: "target"
  graphragSourcePath: "graph_rag_app/source"

guidellm:
  run: false
  args: "--upload-mlflow"
  targetRole: "graphrag"
  workload: "indexing"
  profile: "concurrent"
  concurrencyRates: "1,5,10,20,25"
  maxSeconds: "30"

otel:
  createBucket: false
  tempo:
    bucket: tempo
    storageSize: 10Gi

