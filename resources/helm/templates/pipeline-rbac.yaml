---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-upload-job
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-upload-job-admin
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: pipeline-upload-job
    namespace: {{ .Values.namespace }}
---
# The admin ClusterRole does not include permissions on the DSPA API
# subresource. kube-rbac-proxy gates all KFP API calls (GET → verb:get,
# POST → verb:create) against this resource, so the SA needs both.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-upload-dspa-api
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups:
      - datasciencepipelinesapplications.opendatahub.io
    resources:
      - datasciencepipelinesapplications/api
    resourceNames:
      - dspa
    verbs:
      - get
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-upload-dspa-api
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-upload-dspa-api
subjects:
  - kind: ServiceAccount
    name: pipeline-upload-job
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-default
  namespace: {{ .Values.mlflowNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-pipeline-upload-job
  namespace: {{ .Values.mlflowNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow
subjects:
  - kind: ServiceAccount
    name: pipeline-upload-job
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-pipeline-runner-dspa
  namespace: {{ .Values.mlflowNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-dspa
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-notebook-data-generation
  namespace: {{ .Values.mlflowNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow
subjects:
  - kind: ServiceAccount
    name: data-generation
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-notebook-graphrag-indexing
  namespace: {{ .Values.mlflowNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow
subjects:
  - kind: ServiceAccount
    name: graphrag-indexing
    namespace: {{ .Values.namespace }}
