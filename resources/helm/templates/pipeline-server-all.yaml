---
# This ConfigMap triggers OpenShift to inject the cluster's service signing CA
# into the namespace. The DSPA operator reads it when populating dsp-trusted-ca-dspa,
# ensuring the MLMD gRPC TLS certificate can be verified by the API server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: odh-trusted-ca-bundle
  namespace: {{ .Values.namespace }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
data:
  ca-bundle.crt: ""
  odh-ca-bundle.crt: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-dspa-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.minio.rootUser }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.minio.rootPassword }}
---
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: dspa
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  apiServer:
    deploy: true
    enableOauth: true
    enableSamplePipeline: false
    caBundleFileMountPath: ''
    caBundleFileName: ''
    cacheEnabled: true
    pipelineStore: database
  database:
    disableHealthCheck: false
    mariaDB:
      deploy: true
      pipelineDBName: mlpipeline
      pvcSize: 10Gi
      username: mlpipeline
  dspVersion: v2
  objectStorage:
    disableHealthCheck: false
    enableExternalRoute: false
    externalStorage:
      host: minio-service.{{ .Values.namespace }}.svc.cluster.local
      port: "9000"
      scheme: http
      secure: false
      region: {{ .Values.minio.region }}
      bucket: {{ .Values.minio.bucket }}pipelines
      s3CredentialsSecret:
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
        secretName: dashboard-dspa-secret
  persistenceAgent:
    deploy: true
    numWorkers: 2
  podToPodTLS: true
  scheduledWorkflow:
    cronScheduleTimezone: UTC
    deploy: true

