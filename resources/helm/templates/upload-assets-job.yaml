---
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-assets
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pipeline-upload-job
      {{- if .Values.tls.enableVerification }}
      initContainers:
        - name: concatenate-all-ca-trusts
          image: "{{ .Values.pipelineTools.image.registry }}/{{ .Values.pipelineTools.image.name }}:{{ .Values.pipelineTools.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - cat /etc/pki/ca-trust/extracted/trusted-ca/* /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt > /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          volumeMounts:
            - name: trusted-ca
              mountPath: /etc/pki/ca-trust/extracted/trusted-ca
              readOnly: true
            - name: trusted-ca-concatenated
              mountPath: /etc/pki/ca-trust/extracted/pem
      {{- end }}
      containers:
        - name: upload-assets
          image: "{{ .Values.pipelineTools.image.registry }}/{{ .Values.pipelineTools.image.name }}:{{ .Values.pipelineTools.image.tag }}"
          command:
            - python
            - -c
            - |
              import sys, os, mlflow
              sys.path.insert(0, '/opt/app-root/src/workflows/examples/code_understanding')
              from loaders.mlflow_asset_loader import MlFlowAssetLoader

              mlflow.set_tracking_uri(os.getenv("MLFLOW_TRACKING_URI", "https://mlflow.redhat-ods-applications.svc:8443"))

              MlFlowAssetLoader().upload_all_assets("workflows/examples/code_understanding/assets")
          workingDir: /opt/app-root/src
          env:
            - name: MLFLOW_WORKSPACE
              value: "{{ .Values.namespace }}"
            {{- if not .Values.tls.enableVerification }}
            - name: MLFLOW_TRACKING_INSECURE_TLS
              value: "true"
            {{- else }}
            - name: REQUESTS_CA_BUNDLE
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            - name: SSL_CERT_FILE
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            - name: AWS_CA_BUNDLE
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            - name: MLFLOW_TRACKING_SERVER_CERT_PATH
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            {{- end }}
          {{- if .Values.tls.enableVerification }}
          volumeMounts:
            - name: trusted-ca-concatenated
              mountPath: /etc/pki/ca-trust/extracted/pem
              readOnly: true
          {{- end }}
          envFrom:
            - secretRef:
                name: code-understanding-env
      {{- if .Values.tls.enableVerification }}
      volumes:
        - name: trusted-ca
          configMap:
            name: odh-trusted-ca-bundle
            items:
              - key: ca-bundle.crt
                path: ca-bundle.pem
              - key: odh-ca-bundle.crt
                path: odh-ca-bundle.crt
        - name: trusted-ca-concatenated
          emptyDir: {}
      {{- end }}
