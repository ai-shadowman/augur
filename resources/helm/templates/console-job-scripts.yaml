{{- if .Values.console.jobScripts.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-understanding-job-scripts
  namespace: {{ .Values.namespace }}
data:
  run_pipelines.sh: |-
{{ .Values.console.jobScripts.runPipelines | nindent 4 }}
  mlflow_asset_loader.py: |-
{{ .Values.console.jobScripts.mlflowAssetLoader | nindent 4 }}
  default_asset_loader.py: |-
{{ .Values.console.jobScripts.defaultAssetLoader | nindent 4 }}
{{- end }}
