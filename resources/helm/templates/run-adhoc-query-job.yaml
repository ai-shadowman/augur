{{- if .Values.adhocQuery.run }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: run-adhoc-query-{{ .Values.adhocQuery.jobId }}
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pipeline-upload-job
      containers:
        - name: adhoc-query
          image: {{ .Values.analysis.image.registry }}/{{ .Values.analysis.image.name }}:{{ .Values.analysis.image.tag }}
          command:
            - sh
            - -c
            - |
              git config --global --add safe.directory /opt/app-root/src >/dev/null 2>&1
              git config --global credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_TOKEN}"; }; f' >/dev/null 2>&1
              git -C /opt/app-root/src init -q >/dev/null 2>&1
              git -C /opt/app-root/src remote add origin "{{ .Values.repoUrl }}" >/dev/null 2>&1 || true
              git -C /opt/app-root/src fetch origin "{{ .Values.repoRef }}" -q >/dev/null 2>&1
              git -C /opt/app-root/src reset --hard FETCH_HEAD >/dev/null 2>&1
              workflows/examples/code_understanding/scripts/run_adhoc_query.sh
          workingDir: /opt/app-root/src
          env:
            - name: QUESTION
              valueFrom:
                configMapKeyRef:
                  name: adhoc-query-{{ .Values.adhocQuery.jobId }}
                  key: question
            - name: USE_GLOBAL
              value: "{{ .Values.adhocQuery.useGlobal }}"
            - name: RETRY_COUNT
              value: "{{ .Values.adhocQuery.retryCount }}"
            {{- if .Values.adhocQuery.gitRepo }}
            - name: GIT_REPO
              value: "{{ .Values.adhocQuery.gitRepo }}"
            - name: GIT_BRANCH
              value: "{{ .Values.adhocQuery.gitBranch }}"
            {{- end }}
          envFrom:
            - secretRef:
                name: code-understanding-env
                optional: true
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          emptyDir: {}
{{- end }}
