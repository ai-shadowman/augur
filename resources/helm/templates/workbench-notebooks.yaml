{{- if .Values.deployNotebooks }}
{{- $datagen_image := .Values.dataGeneration.image.digestRef | default (printf "%s/%s:%s" .Values.dataGeneration.image.registry .Values.dataGeneration.image.name .Values.dataGeneration.image.version) }}
{{- $graphrag_image := .Values.graphrag.image.digestRef | default (printf "%s/%s:%s" .Values.graphrag.image.registry .Values.graphrag.image.name .Values.graphrag.image.version) }}
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  annotations:
    notebooks.opendatahub.io/inject-auth: "true"
    notebooks.opendatahub.io/last-image-selection: "custom-data-generation:{{ .Values.dataGeneration.image.version}}"
    opendatahub.io/image-display-name: {{ .Values.dataGeneration.image.title}}
    opendatahub.io/workbench-image-namespace: "redhat-ods-applications"
    openshift.io/description: ""
    openshift.io/display-name: {{ .Values.dataGeneration.notebook.name}}
    opendatahub.io/mlflow-instance: {{ .Values.dataGeneration.notebook.name}}
  name: {{ .Values.dataGeneration.notebook.name}}
  namespace: {{ .Values.namespace}}
  labels:
    app: {{ .Values.dataGeneration.notebook.name}}
    opendatahub.io/odh-managed: "true"
    opendatahub.io/dashboard: "true"
spec:
  template:
    spec:
      enableServiceLinks: false
      initContainers:
        - name: git-clone
          image: {{ $datagen_image }}
          command:
            - sh
            - -c
            - |
              REPO_NAME=$(basename "{{ .Values.repoUrl }}" .git)
              TARGET="/opt/app-root/src/$REPO_NAME"
              git config --global --add safe.directory "$TARGET"
              git init "$TARGET"
              git -C "$TARGET" remote add origin "{{ .Values.repoUrl }}" 2>/dev/null || true
              git -C "$TARGET" fetch origin "{{ .Values.repoRef }}"
              git -C "$TARGET" reset --hard FETCH_HEAD
          volumeMounts:
            - name: workspace-volume
              mountPath: /opt/app-root/src
      containers:
        - name: {{ .Values.dataGeneration.notebook.name}}
          image: {{ $datagen_image }}
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /notebook/{{ .Values.namespace }}/{{ .Values.dataGeneration.notebook.name }}/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /notebook/{{ .Values.namespace }}/{{ .Values.dataGeneration.notebook.name }}/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: workspace-volume
              mountPath: /opt/app-root/src
            - name: shm
              mountPath: /dev/shm
            - name: trusted-ca
              mountPath: /etc/pki/tls/custom-certs
              readOnly: true
            - name: runtime-images
              mountPath: /opt/app-root/pipeline-runtimes/
          envFrom:
            - secretRef:
                name: code-understanding-env
          env:
            - name: NOTEBOOK_ARGS
              value: >-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/{{ .Values.namespace }}/{{ .Values.dataGeneration.notebook.name }}
                --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: "{{ $datagen_image }}"
            - name: REQUESTS_CA_BUNDLE
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: PIPELINES_SSL_SA_CERTS
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: KF_PIPELINES_SSL_SA_CERTS
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: GIT_SSL_CAINFO
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: PIP_CERT
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: code-understanding-env
                  key: MLFLOW_TRACKING_URI
      volumes:
        - name: workspace-volume
          persistentVolumeClaim:
            claimName: datagen-storage
        - name: shm
          emptyDir:
            medium: Memory
        - name: trusted-ca
          configMap:
            name: workbench-trusted-ca-bundle
            optional: true
        - name: runtime-images
          configMap:
            name: pipeline-runtime-images
            optional: true
---
