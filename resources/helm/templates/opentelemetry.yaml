{{- if .Values.otel.enabled }}
---
# S3 credentials for TempoStack → MinIO
apiVersion: v1
kind: Secret
metadata:
  name: tempo-s3-secret
  namespace: {{ .Values.otel.namespace }}
type: Opaque
stringData:
  endpoint: {{ .Values.minio.endpoint }}
  bucket: {{ .Values.otel.tempo.bucket }}
  access_key_id: {{ .Values.minio.rootUser | quote }}
  access_key_secret: {{ .Values.minio.rootPassword | quote }}
---
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoStack
metadata:
  name: {{ .Values.otel.name }}
  namespace: {{ .Values.otel.namespace }}
spec:
  storage:
    secret:
      name: tempo-s3-secret
      type: s3
  storageSize: {{ .Values.otel.tempo.storageSize }}
  retention:
    global:
      traces: {{ .Values.otel.tempo.retention | default "2160h" }}
  tenants:
    mode: openshift
    authentication:
      - tenantName: dev
        tenantId: "1610b0c3-c509-4592-a256-a1871353dbfa"
  template:
    gateway:
      enabled: true
    queryFrontend:
      jaegerQuery:
        enabled: true
---
# Allow the OpenTelemetry Collector ServiceAccount to write traces to the 'dev' tenant
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempostack-traces-write-{{ .Values.otel.name }}
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - dev
    resourceNames:
      - traces
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tempostack-traces-write-{{ .Values.otel.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempostack-traces-write-{{ .Values.otel.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.otel.name }}-collector
    namespace: {{ .Values.otel.namespace }}
---
# Allow authenticated OpenShift Console users to read traces from the 'dev' tenant in Observe -> Traces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempostack-traces-reader-{{ .Values.otel.name }}
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - dev
    resourceNames:
      - traces
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tempostack-traces-reader-{{ .Values.otel.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempostack-traces-reader-{{ .Values.otel.name }}
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:authenticated
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.otel.name }}
  namespace: {{ .Values.otel.namespace }}
spec:
  mode: deployment
  config:
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      otlp:
        endpoint: tempo-{{ .Values.otel.name }}-gateway.{{ .Values.otel.namespace }}.svc.cluster.local:8090
        tls:
          insecure: false
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        auth:
          authenticator: bearertokenauth
        headers:
          X-Scope-OrgID: dev
    service:
      extensions: [bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp]
{{- end }}
