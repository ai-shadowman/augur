name: Release container images

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  build-and-push:
    name: Release ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: data-generation
            context: resources/images/data-generation
          - image: data-indexing
            context: resources/images/data-indexing
          - image: data-analysis
            context: .
          - image: pipeline-tools
            context: .
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit to belong to main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Build and push tagged image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: resources/images/${{ matrix.image }}/Containerfile
          platforms: linux/amd64
          push: true
          tags: quay.io/ai-shadowman/${{ matrix.image }}:${{ github.ref_name }}
