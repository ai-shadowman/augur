metadata:
  id: graph-rag-123
  name: "Code Generation"
  description: "Prepares codebase for GraphRAG indexing"
  version: "1.0.0"
  author: "Omotola Awofolu"

  recommended_models:
    default: "meta-llama/llama-4-maverick"
    compatible: ["mistralai/devstral-2512", "mistralai/ministral-14b-2512"]
    experimental: []

  tags:
    - "code-refactoring"
    - "code-generation"

  license: "Apache-2.0"

  dataset_requirements:
    required_columns:
      - git_repo
      - git_slug
      - file_path
      - language
      - code
      - multi_repo
    description: "Input dataset should contain fundamental data about the codebase."

  output_columns:
  - code_metadata

blocks:

  - block_type: PromptBuilderBlock
    block_config:
      block_name: code_to_metadata_prompt
      # Only what the template still interpolates. git_repo, git_slug,
      # file_path and multi_repo are written into the header from the row by
      # generate_code_comment, so the prompt neither receives them nor is
      # asked for them back. They stay in required_columns above because the
      # surrounding pipeline still needs them on the dataframe.
      input_cols:
      - language
      - code
      output_cols: extract_metadata_prompt
      prompt_config_path: prompts/data_from_code.yaml
      format_as_messages: true

  - block_type: LLMChatBlock
    block_config:
      block_name: get_code_metadata
      input_cols: extract_metadata_prompt
      output_cols: extracted_code_metadata
      # data_from_code.yaml asks for one field, a brief summary of the file,
      # so the answer is a few sentences wrapped in JSON: tens of tokens, not
      # thousands. 1,024 is headroom rather than a measurement, since no run
      # on this machine has an endpoint behind it. The one way it can be too
      # small is a model that reasons in the content channel; if truncated
      # JSON shows up, that is the cause, and the fix is to raise this line
      # rather than to re-add fields to the prompt.
      #
      # This is the only place the budget is set. data_generation.py used to
      # pass max_tokens=32_000 to set_model_config, and sdg_hub writes that
      # straight onto the block, so the 64,000 written here never took effect.
      max_tokens: 1024
      async_mode: true
      n: 1

  - block_type: LLMParserBlock
    block_config:
      block_name: get_code_metadata_output
      input_cols: extracted_code_metadata
      extract_content: true

  - block_type: TextParserBlock
    block_config:
      block_name: extract_code_to_metadata_prompt_text
      input_cols: get_code_metadata_output_content
      output_cols: extracted_data
      start_tags: [""]
      end_tags: [""]

  - block_type: CustomDeleteColumnsBlock
    block_config:
      block_name: drop_fields
      input_cols:
        - extract_metadata_prompt
        - get_code_metadata_output_content
        - extracted_code_metadata
